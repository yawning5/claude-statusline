name: test

# The suite shells out to real git in temporary repositories and renders paths
# through the platform's own separators, so it is as much a platform test as a
# unit test. Every OS the status line runs on gets a job: a Windows-only failure
# went unnoticed once already.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others — that is exactly how a
      # platform-specific break stays hidden.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The README's stated minimum, the active LTS, and current.
        node: ['18', '22', '24']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # Recorded per job: the git segment needs 2.15+ for --no-optional-locks,
      # and a runner image bump is the likeliest cause of a sudden git failure.
      - name: Versions
        run: node --version
      - run: git --version

      - name: Tests
        run: node test/run.js

      # The installers touch a real settings.json, so they get a real run against
      # a throwaway CLAUDE_CONFIG_DIR. Silently mangling someone's settings is
      # the worst thing this repo could do, and unit tests cover only the merge.
      - name: install.sh
        shell: bash
        run: |
          set -euo pipefail
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude-sh"
          bash install.sh
          grep -q '"statusLine"' "$CLAUDE_CONFIG_DIR/settings.json"
          grep -q 'statusline.js' "$CLAUDE_CONFIG_DIR/settings.json"

      - name: install.ps1 (pwsh 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'claude-pwsh'
          ./install.ps1
          $s = Get-Content (Join-Path $env:CLAUDE_CONFIG_DIR 'settings.json') -Raw | ConvertFrom-Json
          if ($s.statusLine.command -notlike '*statusline.js*') { throw "statusLine missing: $($s | ConvertTo-Json -Depth 100)" }

      # Windows PowerShell 5.1 is what a stock Windows box actually has.
      - name: install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'claude-ps51'
          ./install.ps1
          $s = Get-Content (Join-Path $env:CLAUDE_CONFIG_DIR 'settings.json') -Raw | ConvertFrom-Json
          if ($s.statusLine.command -notlike '*statusline.js*') { throw 'statusLine missing' }
